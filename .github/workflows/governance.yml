name: Governance (SSOT)

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "AGENTS.md"
      - "CLAUDE.md"
      - "docs/**"
      - "scripts/check-governance.sh"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate SSOT structure
        run: scripts/check-governance.sh
